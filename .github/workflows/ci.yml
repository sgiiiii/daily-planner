name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  sqlite:
    name: Тесты API и WSGI (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Тесты
        run: python -m unittest discover -s tests -v

  postgres:
    name: Тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANNER_TEST_DATABASE_URL: postgresql://planner:planner@localhost:5432/planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Тесты
        run: python -m unittest discover -s tests -v

  interface:
    name: Интерфейс в Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # На раннере Chrome может отсутствовать или лежать не там, где мы ищем.
      # Ставим Chrome for Testing и передаём путь через CHROME_PATH.
      - name: Установить Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Проверки интерфейса
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python tools/ui_check.py --out screenshots
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
